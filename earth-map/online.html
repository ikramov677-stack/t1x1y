<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта и маршруты</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg: rgba(18,22,30,.88); --fg: #eef2f7; --muted: #9aa6b8; --accent: #4da3ff; }
  html, body { margin: 0; height: 100%; background: #0b0e14; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; z-index: 1000; background: var(--bg); color: var(--fg);
           border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.35); backdrop-filter: blur(6px); }
  #search { top: 12px; left: 56px; right: 64px; max-width: 420px; display: flex; }
  #search input { flex: 1; min-width: 0; padding: 10px 12px; border: 0; background: transparent; color: var(--fg); font-size: 15px; outline: none; }
  #search button { border: 0; background: var(--accent); color: #fff; padding: 0 14px; border-radius: 0 10px 10px 0; cursor: pointer; font-size: 15px; }
  #results { position: absolute; top: 100%; left: 0; right: 0; margin-top: 6px; background: var(--bg); border-radius: 10px; overflow: hidden; display: none; }
  #results div { padding: 8px 12px; cursor: pointer; border-top: 1px solid rgba(255,255,255,.06); }
  #results div:hover { background: rgba(77,163,255,.2); }
  #coords { bottom: 26px; left: 12px; padding: 6px 10px; font-variant-numeric: tabular-nums; font-size: 13px; }
  #tools { top: 80px; left: 12px; display: flex; flex-direction: column; overflow: hidden; }
  #tools button { width: 34px; height: 34px; border: 0; background: transparent; color: var(--fg); font-size: 17px; cursor: pointer; }
  #tools button:hover, #tools button.on { background: rgba(77,163,255,.3); }
  .leaflet-control-layers { background: var(--bg) !important; color: var(--fg); border: 0 !important; border-radius: 10px !important; }
  .leaflet-control-layers-toggle { filter: invert(1); }
  .leaflet-container { background: #0b0e14; }
  #route { top: 64px; left: 56px; width: min(360px, calc(100vw - 120px)); padding: 12px; display: none; gap: 8px; max-height: calc(100% - 140px); overflow: hidden; flex-direction: column; box-sizing: border-box; }
  #route.open { display: flex; }
  #route .seg { display: flex; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; overflow: hidden; }
  #route .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 7px 4px; cursor: pointer; font: 500 13px system-ui, sans-serif; }
  #route .seg button.on { background: rgba(77,163,255,.3); color: var(--fg); }
  #route .pt { display: flex; gap: 8px; align-items: center; }
  #route .pt b { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: #fff; }
  #route input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: var(--fg); font-size: 14px; outline: none; }
  #route .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #route .row button { border: 1px solid rgba(255,255,255,.12); background: transparent; color: var(--fg); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  #route .sum { font-size: 15px; font-weight: 600; }
  #route .hint { color: var(--muted); font-size: 12px; margin: 0; }
  #steps { margin: 0; padding: 0; list-style: none; overflow-y: auto; min-height: 0; font-size: 13px; }
  #steps li { display: flex; gap: 8px; padding: 6px 2px; border-top: 1px solid rgba(255,255,255,.06); cursor: pointer; }
  #steps li:hover { background: rgba(77,163,255,.12); }
  #steps li span:first-child { flex: none; width: 20px; text-align: center; }
  #steps li small { margin-left: auto; color: var(--muted); white-space: nowrap; }
  @media (max-width: 520px) { #route { left: 12px; top: 64px; width: calc(100vw - 24px); max-height: 55%; } }
  @media (max-width: 520px) { #search { left: 12px; right: 56px; } #tools { top: 64px; } }
</style>
</head>
<body>
<div id="map"></div>

<div id="search" class="panel">
  <input id="q" type="search" placeholder="Поиск: город, адрес, страна…" autocomplete="off">
  <button id="go" title="Найти">🔍</button>
  <div id="results"></div>
</div>

<div id="tools" class="panel">
  <button id="locate" title="Где я?">📍</button>
  <button id="routeBtn" title="Маршрут">🚗</button>
  <button id="night" title="День / ночь">🌗</button>
  <button id="world" title="Вся Земля">🌍</button>
</div>

<div id="route" class="panel">
  <div class="seg" role="group" aria-label="Способ передвижения">
    <button data-p="car" class="on">🚗 Авто</button><button data-p="foot">🚶 Пешком</button><button data-p="bike">🚲 Велосипед</button>
  </div>
  <div class="pt"><b style="background:#2e9b4f">A</b><input id="rA" placeholder="Откуда: адрес или место" autocomplete="off"></div>
  <div class="pt"><b style="background:#d6453d">B</b><input id="rB" placeholder="Куда: адрес или место" autocomplete="off"></div>
  <div class="row"><button id="rMe">📍 Я здесь → A</button><button id="rSwap">⇅ Поменять</button><button id="rClr">Сбросить</button></div>
  <p class="hint" id="rMsg">Введите адреса и нажмите Enter, или кликните по карте: первый клик — A, второй — B. Точки можно перетаскивать.</p>
  <div class="sum" id="rSum" hidden></div>
  <ol id="steps"></ol>
</div>

<div id="coords" class="panel">—</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl: false, worldCopyJump: true, minZoom: 2 }).setView([30, 20], 3);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.control.scale({ metric: true, imperial: false, position: 'bottomright' }).addTo(map);

// --- Реальные подложки ---------------------------------------------------
const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const satellite = L.tileLayer(esri + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: 'Снимки © Esri, Maxar, Earthstar Geographics' });
const labels = L.tileLayer(esri + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: 'Подписи © Esri' });
const hybrid = L.layerGroup([satellite, labels]);
const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© участники OpenStreetMap' });
const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17, attribution: '© OpenStreetMap, SRTM | стиль © OpenTopoMap' });
const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 20, attribution: '© OpenStreetMap © CARTO' });

hybrid.addTo(map);
L.control.layers({
  'Спутник + подписи': hybrid,
  'Спутник': satellite,
  'Улицы (OSM)': streets,
  'Рельеф': topo,
  'Тёмная': dark
}, null, { position: 'topright' }).addTo(map);

// --- Координаты ----------------------------------------------------------
const coordsEl = document.getElementById('coords');
const fmt = (v, p, n) => Math.abs(v).toFixed(4) + '° ' + (v >= 0 ? p : n);
const wrapLng = lng => ((lng + 540) % 360) - 180;
map.on('mousemove', e => {
  coordsEl.textContent = fmt(e.latlng.lat, 'с.ш.', 'ю.ш.') + ', ' + fmt(wrapLng(e.latlng.lng), 'в.д.', 'з.д.');
});
map.on('click', e => {
  if (document.getElementById('route').classList.contains('open')) return;
  const lat = e.latlng.lat.toFixed(5), lng = wrapLng(e.latlng.lng).toFixed(5);
  L.popup().setLatLng(e.latlng).setContent(`<b>${lat}, ${lng}</b><br><small>Зум ${map.getZoom()}</small>`).openOn(map);
});

// --- Поиск (Nominatim / OpenStreetMap) -----------------------------------
const q = document.getElementById('q'), results = document.getElementById('results');
let marker;
async function search() {
  const text = q.value.trim();
  if (!text) return;
  results.style.display = 'block';
  results.innerHTML = '<div>Ищу…</div>';
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=ru&q=' + encodeURIComponent(text));
    const data = await r.json();
    if (!data.length) { results.innerHTML = '<div>Ничего не найдено</div>'; return; }
    results.innerHTML = '';
    data.forEach(p => {
      const d = document.createElement('div');
      d.textContent = p.display_name;
      d.onclick = () => goTo(p);
      results.appendChild(d);
    });
    if (data.length === 1) goTo(data[0]);
  } catch { results.innerHTML = '<div>Ошибка сети</div>'; }
}
function goTo(p) {
  results.style.display = 'none';
  const b = p.boundingbox.map(Number);
  map.flyToBounds([[b[0], b[2]], [b[1], b[3]]], { maxZoom: 17, duration: 1.5 });
  if (marker) marker.remove();
  marker = L.marker([+p.lat, +p.lon]).addTo(map).bindPopup(p.display_name).openPopup();
}
document.getElementById('go').onclick = search;
q.addEventListener('keydown', e => { if (e.key === 'Enter') search(); if (e.key === 'Escape') results.style.display = 'none'; });

// --- Моё местоположение --------------------------------------------------
document.getElementById('locate').onclick = () => map.locate({ setView: true, maxZoom: 15 });
map.on('locationfound', e => {
  L.circle(e.latlng, { radius: e.accuracy, color: '#4da3ff', weight: 1 }).addTo(map);
  L.circleMarker(e.latlng, { radius: 7, color: '#fff', fillColor: '#4da3ff', fillOpacity: 1 }).addTo(map).bindPopup('Вы здесь').openPopup();
});
map.on('locationerror', e => alert('Не удалось определить местоположение: ' + e.message));
document.getElementById('world').onclick = () => map.flyTo([30, 20], 3);

// --- Линия дня и ночи (реальное положение Солнца сейчас) ------------------
function nightPolygon(date) {
  const rad = Math.PI / 180;
  const jd = date.getTime() / 86400000 + 2440587.5, n = jd - 2451545.0;
  const L0 = (280.460 + 0.9856474 * n) % 360, g = (357.528 + 0.9856003 * n) % 360;
  const lambda = L0 + 1.915 * Math.sin(g * rad) + 0.020 * Math.sin(2 * g * rad);
  const eps = 23.439 - 0.0000004 * n;
  const decl = Math.asin(Math.sin(eps * rad) * Math.sin(lambda * rad)) / rad;
  let ra = Math.atan2(Math.cos(eps * rad) * Math.sin(lambda * rad), Math.cos(lambda * rad)) / rad;
  const gmst = (18.697374558 + 24.06570982441908 * n) % 24 * 15;
  const sunLng = ra - gmst;                         // долгота подсолнечной точки
  const pts = [];
  for (let lng = -540; lng <= 540; lng += 2) {
    const lat = Math.atan(-Math.cos((lng - sunLng) * rad) / Math.tan(decl * rad)) / rad;
    pts.push([lat, lng]);
  }
  const pole = decl > 0 ? -90 : 90;                 // ночной полюс
  return [[pole, -540], ...pts, [pole, 540]];
}
const night = L.polygon(nightPolygon(new Date()), {
  stroke: false, fillColor: '#000814', fillOpacity: 0.45, interactive: false });
setInterval(() => night.setLatLngs(nightPolygon(new Date())), 60000);
const nightBtn = document.getElementById('night');
nightBtn.onclick = () => {
  if (map.hasLayer(night)) { night.remove(); nightBtn.classList.remove('on'); }
  else { night.addTo(map); nightBtn.classList.add('on'); }
};

// --- Навигация по дорогам (OSRM, данные OpenStreetMap) --------------------
const routeP = document.getElementById('route'), routeBtn = document.getElementById('routeBtn');
const R = { a: null, b: null, profile: 'car', line: null, mA: null, mB: null, req: 0 };
const pin = (c, t) => L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13],
  html: `<div style="width:26px;height:26px;border-radius:50%;background:${c};color:#fff;font:700 13px system-ui;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)">${t}</div>` });
routeBtn.onclick = () => {
  const open = routeP.classList.toggle('open');
  routeBtn.classList.toggle('on', open);
  map.getContainer().style.cursor = open ? 'crosshair' : '';
};
routeP.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  routeP.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  R.profile = b.dataset.p; calcRoute();
});
function setPt(which, latlng, label) {
  R[which] = L.latLng(latlng);
  const key = which === 'a' ? 'mA' : 'mB';
  if (!R[key]) {
    R[key] = L.marker(R[which], { draggable: true, icon: pin(which === 'a' ? '#2e9b4f' : '#d6453d', which.toUpperCase()) }).addTo(map);
    R[key].on('dragend', e => { R[which] = e.target.getLatLng(); document.getElementById(which === 'a' ? 'rA' : 'rB').value = fmtPt(R[which]); calcRoute(); });
  } else R[key].setLatLng(R[which]);
  document.getElementById(which === 'a' ? 'rA' : 'rB').value = label || fmtPt(R[which]);
  calcRoute();
}
const fmtPt = ll => ll.lat.toFixed(5) + ', ' + wrapLng(ll.lng).toFixed(5);
map.on('click', e => {
  if (!routeP.classList.contains('open')) return;
  map.closePopup();
  setPt(!R.a ? 'a' : !R.b ? 'b' : 'b', e.latlng);
});
async function geocode(text) {
  const m = text.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m) return { lat: +m[1], lon: +m[2], display_name: text };
  const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ru&q=' + encodeURIComponent(text));
  return (await r.json())[0];
}
['a', 'b'].forEach(w => {
  const inp = document.getElementById(w === 'a' ? 'rA' : 'rB');
  inp.addEventListener('keydown', async e => {
    if (e.key !== 'Enter' || !inp.value.trim()) return;
    msg('Ищу адрес…');
    try {
      const p = await geocode(inp.value);
      if (!p) return msg('Адрес не найден. Уточните запрос или кликните по карте.');
      setPt(w, [+p.lat, +p.lon], p.display_name.split(',').slice(0, 3).join(','));
    } catch { msg('Нет связи с сервисом поиска адресов.'); }
  });
});
document.getElementById('rMe').onclick = () => {
  if (!navigator.geolocation) return msg('Браузер не умеет определять местоположение.');
  msg('Определяю местоположение…');
  navigator.geolocation.getCurrentPosition(p => setPt('a', [p.coords.latitude, p.coords.longitude], 'Моё местоположение'),
    e => msg('Не удалось определить местоположение: ' + e.message), { enableHighAccuracy: true, timeout: 15000 });
};
document.getElementById('rSwap').onclick = () => {
  const a = R.a, b = R.b, va = document.getElementById('rA').value, vb = document.getElementById('rB').value;
  if (b) setPtSilent('a', b, vb); else clearPt('a');
  if (a) setPtSilent('b', a, va); else clearPt('b');
  calcRoute();
};
function setPtSilent(w, ll, label) { const c = calcRoute; calcRoute = () => {}; setPt(w, ll, label); calcRoute = c; }
function clearPt(w) {
  const key = w === 'a' ? 'mA' : 'mB';
  if (R[key]) { R[key].remove(); R[key] = null; }
  R[w] = null; document.getElementById(w === 'a' ? 'rA' : 'rB').value = '';
}
document.getElementById('rClr').onclick = () => { clearPt('a'); clearPt('b'); calcRoute(); };
function msg(t) { const m = document.getElementById('rMsg'); m.textContent = t; m.hidden = !t; }

const DIR = { left: 'налево', right: 'направо', 'slight left': 'плавно налево', 'slight right': 'плавно направо',
  'sharp left': 'резко налево', 'sharp right': 'резко направо', straight: 'прямо', uturn: 'разворот' };
const ARR = { left: '←', right: '→', 'slight left': '↖', 'slight right': '↗', 'sharp left': '↙', 'sharp right': '↘', straight: '↑', uturn: '↶' };
function stepText(s) {
  const t = s.maneuver.type, mod = s.maneuver.modifier, road = s.name ? ` на ${s.name}` : '';
  const onto = s.name ? ` по ${s.name}` : '';
  switch (t) {
    case 'depart': return 'Начните движение' + onto;
    case 'arrive': return 'Вы прибыли' + (mod === 'left' ? ' — пункт слева' : mod === 'right' ? ' — пункт справа' : '');
    case 'roundabout': case 'rotary': return `На круговом движении — ${s.maneuver.exit || ''}-й съезд` + road;
    case 'exit roundabout': case 'exit rotary': return 'Съезд с кольца' + road;
    case 'merge': return 'Перестройтесь' + (mod ? ' ' + (DIR[mod] || '') : '') + road;
    case 'on ramp': return 'Въезд на магистраль' + road;
    case 'off ramp': return 'Съезд с магистрали' + road;
    case 'fork': return 'На развилке держитесь ' + (mod && mod.includes('left') ? 'левее' : 'правее') + road;
    case 'end of road': return 'В конце дороги ' + (DIR[mod] || '') + road;
    case 'continue': case 'new name': return (mod && mod !== 'straight' ? 'Поверните ' + DIR[mod] : 'Продолжайте прямо') + onto;
    default: return mod === 'uturn' ? 'Развернитесь' + road : mod && mod !== 'straight' ? 'Поверните ' + DIR[mod] + road : 'Прямо' + onto;
  }
}
const fmtDist = m => m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1).replace('.', ',') + ' км' : Math.round(m / 10) * 10 + ' м';
const fmtTime = s => { const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return (h ? h + ' ч ' : '') + m + ' мин'; };
const SPEED = { foot: 5, bike: 16 };  // км/ч — для пешком и велосипеда считаем время сами
let calcRoute = async function () {
  const steps = document.getElementById('steps'), sum = document.getElementById('rSum');
  if (R.line) { R.line.remove(); R.line = null; }
  steps.innerHTML = ''; sum.hidden = true;
  if (!R.a || !R.b) { msg(R.a ? 'Теперь выберите точку B.' : 'Введите адреса и нажмите Enter, или кликните по карте: первый клик — A, второй — B. Точки можно перетаскивать.'); return; }
  const id = ++R.req;
  msg('Строю маршрут…');
  const svc = { car: 'routed-car', foot: 'routed-foot', bike: 'routed-bike' }[R.profile];
  const url = `https://routing.openstreetmap.de/${svc}/route/v1/driving/${R.a.lng},${R.a.lat};${R.b.lng},${R.b.lat}?overview=full&geometries=geojson&steps=true&alternatives=false`;
  try {
    const res = await fetch(url), data = await res.json();
    if (id !== R.req) return;
    if (data.code !== 'Ok' || !data.routes.length) return msg('Маршрут не найден: между точками нет дорог (например, через океан).');
    const r = data.routes[0];
    const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
    R.line = L.layerGroup([
      L.polyline(coords, { color: '#0b3d91', weight: 9, opacity: 0.6 }),
      L.polyline(coords, { color: '#4da3ff', weight: 5 })
    ]).addTo(map);
    map.fitBounds(L.latLngBounds(coords), { padding: [40, 40] });
    const secs = SPEED[R.profile] ? r.distance / 1000 / SPEED[R.profile] * 3600 : r.duration;
    sum.textContent = fmtDist(r.distance) + ' · ' + fmtTime(secs);
    sum.hidden = false; msg('');
    for (const leg of r.legs) for (const s of leg.steps) {
      const li = document.createElement('li');
      const ic = s.maneuver.type === 'arrive' ? '🏁' : s.maneuver.type === 'depart' ? '🟢' : (ARR[s.maneuver.modifier] || '↑');
      li.innerHTML = '<span></span><span></span><small></small>';
      li.children[0].textContent = ic; li.children[1].textContent = stepText(s);
      li.children[2].textContent = s.distance ? fmtDist(s.distance) : '';
      const [lng, lat] = s.maneuver.location;
      li.onclick = () => map.flyTo([lat, lng], 17);
      steps.appendChild(li);
    }
  } catch { if (id === R.req) msg('Нет связи с сервисом маршрутов. Проверьте интернет и попробуйте ещё раз.'); }
};
</script>
</body>
</html>
