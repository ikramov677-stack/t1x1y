<title>Земля</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL planet, floating instrument panels in the corners like a spacecraft HUD */
:root {
  --space: #05070d;
  --panel: rgba(12, 17, 28, 0.78);
  --line: rgba(160, 190, 230, 0.16);
  --fg: #e8eef8;
  --muted: #8d9bb3;
  --accent: #ffb547;      /* sunlight */
  --ice: #7cc4ff;         /* atmosphere */
  --display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--space); color: var(--fg); font-family: var(--body); overflow: hidden; touch-action: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#gl.drag { cursor: grabbing; }
.panel { position: fixed; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
         backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#head { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
        width: min(340px, calc(100vw - 32px)); padding: 14px 14px 12px; display: grid; gap: 10px; }
h1 { margin: 0; font: 700 22px/1 var(--display); letter-spacing: .02em; }
h1 small { display: block; margin-top: 6px; font: 400 11px/1.3 var(--body); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
#find { position: relative; }
#q { width: 100%; box-sizing: border-box; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line);
     background: rgba(255,255,255,.05); color: var(--fg); font: 500 14px var(--body); outline: none; }
#q:focus { border-color: var(--ice); }
#sugg { position: absolute; top: calc(100% + 4px); left: 0; right: 0; max-height: 240px; overflow-y: auto;
        background: #0e1422; border: 1px solid var(--line); border-radius: 9px; z-index: 6; }
#sugg button { display: block; width: 100%; text-align: left; padding: 8px 11px; border: 0; background: none; color: var(--fg); font: 14px var(--body); cursor: pointer; }
#sugg button:hover, #sugg button.act { background: rgba(124,196,255,.15); }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button, .chip { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--body); padding: 7px 11px; cursor: pointer; }
.chip { border: 1px solid var(--line); border-radius: 9px; }
.seg button[aria-pressed="true"], .chip[aria-pressed="true"] { background: rgba(124,196,255,.16); color: var(--fg); }
.chip[aria-pressed="true"]#bNight { background: rgba(255,181,71,.16); }
button:focus-visible, #q:focus-visible { outline: 2px solid var(--ice); outline-offset: 1px; }
#card { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        width: min(340px, calc(100vw - 32px)); padding: 14px; display: grid; gap: 8px; }
#card h2 { margin: 0; font: 700 17px/1.2 var(--display); text-wrap: balance; }
#card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
#card dt { color: var(--muted); }
#card dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
#card .hint { color: var(--muted); font-size: 13px; margin: 0; }
#clock { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
         padding: 8px 12px; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
#clock b { color: var(--accent); font-weight: 500; }
#tip { position: fixed; z-index: 4; pointer-events: none; padding: 4px 9px; border-radius: 7px; background: rgba(5,7,13,.85);
       border: 1px solid var(--line); font: 500 13px var(--body); transform: translate(14px, 14px); white-space: nowrap; }
#err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
@media (max-width: 560px) {
  #clock { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); display: none; }
  #head { padding: 12px; gap: 8px; }
  h1 { font-size: 19px; }
}
</style>

<canvas id="gl" aria-label="Интерактивный глобус Земли"></canvas>

<section id="head" class="panel">
  <h1>Земля<small>Снимки NASA Blue Marble · границы Natural Earth</small></h1>
  <div id="find">
    <input id="q" type="search" placeholder="Найти страну: Япония, Бразилия…" autocomplete="off" aria-label="Поиск страны">
    <div id="sugg" hidden></div>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="Вид">
      <button id="bGlobe" aria-pressed="true">Глобус</button>
      <button id="bFlat" aria-pressed="false">Карта</button>
    </div>
    <button class="chip" id="bBorders" aria-pressed="true">Границы</button>
    <button class="chip" id="bNight" aria-pressed="true">День и ночь</button>
    <button class="chip" id="bSpin" aria-pressed="true">Вращение</button>
  </div>
</section>

<section id="card" class="panel" aria-live="polite">
  <h2 id="cName">Нажмите на любую точку</h2>
  <p class="hint" id="cHint">Тяните, чтобы вращать, колесо или два пальца — приближение. Подсветка ночи соответствует реальному положению Солнца прямо сейчас.</p>
  <dl id="cData" hidden>
    <dt>Координаты</dt><dd id="cCoord"></dd>
    <dt>Солнце</dt><dd id="cSun"></dd>
    <dt>Солнечное время</dt><dd id="cTime"></dd>
  </dl>
</section>

<div id="clock" class="panel">UTC <b id="utc">--:--</b> · подсолнечная точка <span id="subsolar">—</span></div>
<div id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const TOPO = /*TOPO*/null;
const NAMES = /*NAMES*/null;
const DAY_SRC = "__DAY__";
const NIGHT_SRC = "__NIGHT__";

(function () {
if (!window.THREE || !window.d3 || !window.topojson) {
  document.body.insertAdjacentHTML('beforeend', '<div id="err">Не удалось загрузить библиотеки. Проверьте подключение к интернету и обновите страницу.</div>');
  return;
}
const PI = Math.PI, RAD = PI / 180, DEG = 180 / PI;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

// ---------- данные ----------
const features = topojson.feature(TOPO, TOPO.objects.countries).features;
features.forEach((f, i) => {
  f.ru = NAMES[i] || f.properties.name;
  f.bounds = d3.geoBounds(f);
  f.centroid = d3.geoCentroid(f);
  f.area = d3.geoArea(f);
});

// ---------- рендер ----------
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);

const loader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function tex(src) { const t = loader.load(src); t.anisotropy = maxAniso; return t; }

const U = {
  uDay: { value: tex(DAY_SRC) },
  uNight: { value: tex(NIGHT_SRC) },
  uRot: { value: new THREE.Matrix3() },
  uMorph: { value: 0 },
  uSun: { value: new THREE.Vector3(1, 0, 0) },
  uNightOn: { value: 1 },
  uColor: { value: new THREE.Color(0xffffff) },
  uAlpha: { value: 1 },
  uLift: { value: 0 },
};

// Общая часть вершинного шейдера: из (долгота, широта) в позицию глобуса или плоской карты.
const PLACE = `
uniform mat3 uRot; uniform float uMorph; uniform float uLift;
vec3 earthN(vec2 ll){ float c = cos(ll.y); return vec3(c*sin(ll.x), sin(ll.y), c*cos(ll.x)); }
vec3 place(vec2 ll){
  vec3 s = uRot * earthN(ll) * (1.0 + uLift);
  vec3 p = vec3(ll.x / 3.14159265 * 2.0, ll.y / 1.5707963 , uLift * 4.0);
  return mix(s, p, uMorph);
}`;

const earthMat = new THREE.ShaderMaterial({
  uniforms: U, side: THREE.DoubleSide,
  vertexShader: PLACE + `
    varying vec2 vUv; varying vec3 vN;
    void main(){
      vUv = uv;
      vec2 ll = vec2((uv.x - 0.5) * 6.2831853, (uv.y - 0.5) * 3.14159265);
      vN = earthN(ll);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(place(ll), 1.0);
    }`,
  fragmentShader: `
    uniform sampler2D uDay, uNight; uniform vec3 uSun; uniform float uNightOn;
    varying vec2 vUv; varying vec3 vN;
    void main(){
      vec3 day = texture2D(uDay, vUv).rgb;
      vec3 night = texture2D(uNight, vUv).rgb;
      float d = dot(normalize(vN), uSun);
      float lit = smoothstep(-0.08, 0.12, d);
      vec3 dark = day * 0.09 + night * vec3(1.25, 1.05, 0.8) * 1.3;
      vec3 col = mix(dark, day * (0.92 + 0.15 * clamp(d, 0.0, 1.0)), lit);
      // тёплая полоса сумерек на линии терминатора
      col += vec3(0.35, 0.16, 0.02) * (1.0 - abs(lit * 2.0 - 1.0)) * 0.35;
      gl_FragColor = vec4(mix(day, col, uNightOn), 1.0);
    }`,
});
const earth = new THREE.Mesh(new THREE.PlaneGeometry(1, 1, 360, 180), earthMat);
scene.add(earth);

// Атмосфера (только в режиме глобуса)
const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.06, 96, 64), new THREE.ShaderMaterial({
  uniforms: { uA: { value: 1 } }, side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vN = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.0); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform float uA; varying vec3 vN; varying vec3 vV; void main(){ float i = pow(clamp(-dot(vN, vV) / 0.34, 0.0, 1.0), 2.2); gl_FragColor = vec4(vec3(0.3,0.58,1.0) * i * 0.9 * uA, 1.0); }`,
}));
scene.add(atmo);

// Звёзды
{
  const n = 2600, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = Math.random() * 2 - 1, t = Math.random() * 2 * PI, r = 30 + Math.random() * 20;
    const s = Math.sqrt(1 - u * u);
    pos.set([r * s * Math.cos(t), r * u, r * s * Math.sin(t)], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xbfd2ff, size: 0.09, sizeAttenuation: true, transparent: true, opacity: 0.8 })));
}

// Линии (границы, подсветка) — те же правила размещения, что и у поверхности
function lineMaterial(color, alpha, lift) {
  return new THREE.ShaderMaterial({
    uniforms: { uRot: U.uRot, uMorph: U.uMorph, uColor: { value: new THREE.Color(color) }, uAlpha: { value: alpha }, uLift: { value: lift } },
    transparent: true, depthWrite: false,
    vertexShader: PLACE + `attribute vec2 ll; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(place(ll), 1.0); }`,
    fragmentShader: `uniform vec3 uColor; uniform float uAlpha; void main(){ gl_FragColor = vec4(uColor, uAlpha); }`,
  });
}
function linesFrom(multiLine) {
  const out = [];
  for (const line of multiLine) for (let i = 1; i < line.length; i++) {
    const a = line[i - 1], b = line[i];
    if (Math.abs(a[0] - b[0]) > 180) continue;           // не тянуть отрезок через линию перемены дат
    out.push(a[0] * RAD, a[1] * RAD, b[0] * RAD, b[1] * RAD);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('ll', new THREE.BufferAttribute(new Float32Array(out), 2));
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(out.length / 2 * 3), 3));
  return g;
}
const borderMesh = topojson.mesh(TOPO, TOPO.objects.countries, (a, b) => a !== b);
const borders = new THREE.LineSegments(linesFrom(borderMesh.coordinates), lineMaterial(0xffffff, 0.45, 0.0015));
borders.frustumCulled = false;
scene.add(borders);

const hiMat = lineMaterial(0xffb547, 1, 0.0025);
const hoverMat = lineMaterial(0x7cc4ff, 0.9, 0.002);
let hiLines = null, hoverLines = null;
function outline(f) {
  const geom = f.geometry;
  const rings = geom.type === 'Polygon' ? geom.coordinates : geom.coordinates.flat();
  return rings;
}
function setLines(old, f, mat) {
  if (old) { scene.remove(old); old.geometry.dispose(); }
  if (!f) return null;
  const l = new THREE.LineSegments(linesFrom(outline(f)), mat);
  l.frustumCulled = false; l.renderOrder = 2; scene.add(l);
  return l;
}

// ---------- Солнце ----------
function sunNow(date) {
  const n = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
  const L = (280.460 + 0.9856474 * n) % 360, g = ((357.528 + 0.9856003 * n) % 360) * RAD;
  const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * RAD;
  const eps = (23.439 - 0.0000004 * n) * RAD;
  const decl = Math.asin(Math.sin(eps) * Math.sin(lambda));
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda));
  const gmst = ((18.697374558 + 24.06570982441908 * n) % 24) * 15 * RAD;
  let lon = ra - gmst; lon = Math.atan2(Math.sin(lon), Math.cos(lon));
  return { lat: decl, lon };
}
const nVec = (lat, lon) => new THREE.Vector3(Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon));
let sun = sunNow(new Date());
function updateSun() {
  const now = new Date();
  sun = sunNow(now);
  U.uSun.value.copy(nVec(sun.lat, sun.lon));
  $('utc').textContent = now.toISOString().slice(11, 16);
  $('subsolar').textContent = fmtLL(sun.lat * DEG, sun.lon * DEG, 1);
}

// ---------- состояние вида ----------
const view = {
  lat: 25 * RAD, lon: 50 * RAD, dist: 3.4,      // глобус
  px: 0, py: 0, fz: 0,                          // карта: центр и удаление камеры
  mode: 'globe', morph: 0, spin: !reduceMotion,
};
let anim = null;  // {from, to, t0, dur}
const fitFlat = () => Math.max(2 / (2 * Math.tan(20 * RAD)), 4 / (2 * Math.tan(20 * RAD) * camera.aspect)) * 1.02;

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (view.mode === 'flat') view.fz = Math.min(view.fz, fitFlat());
}
addEventListener('resize', resize); resize();
view.fz = fitFlat();

const rotM = new THREE.Matrix4(), tmp = new THREE.Matrix4();
function applyView() {
  rotM.makeRotationX(view.lat).multiply(tmp.makeRotationY(-view.lon));
  U.uRot.value.setFromMatrix4(rotM);
  const m = view.morph, e = m * m * (3 - 2 * m);
  U.uMorph.value = e;
  atmo.material.uniforms.uA.value = 1 - e;
  atmo.visible = e < 0.99;
  // камера: глобус — (0,0,dist); карта — над точкой (px, py)
  camera.position.set(view.px * e, view.py * e, view.dist * (1 - e) + view.fz * e);
  camera.lookAt(view.px * e, view.py * e, 0);
}

// ---------- взаимодействие ----------
const ptrs = new Map();
let dragMoved = 0, pinch0 = 0, lastTap = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragMoved = 0; anim = null; view.spin = false; setPressed('bSpin', false);
  if (ptrs.size === 2) pinch0 = pinchDist();
  canvas.classList.add('drag');
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) { hover(e.clientX, e.clientY); return; }
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  dragMoved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size === 2) {
    const d = pinchDist(); if (pinch0) zoom(pinch0 / d); pinch0 = d; return;
  }
  const h = innerHeight;
  if (view.mode === 'globe') {
    const k = (view.dist - 1) / h * 1.6;
    view.lon -= dx * k; view.lat = Math.max(-85 * RAD, Math.min(85 * RAD, view.lat + dy * k));
  } else {
    const k = 2 * Math.tan(20 * RAD) * view.fz / h;
    view.px -= dx * k; view.py += dy * k; clampFlat();
  }
  $('tip').hidden = true;
});
function endPtr(e) {
  const had = ptrs.delete(e.pointerId);
  if (!ptrs.size) canvas.classList.remove('drag');
  pinch0 = ptrs.size === 2 ? pinchDist() : 0;
  if (had && dragMoved < 6 && !ptrs.size) pick(e.clientX, e.clientY);
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); canvas.classList.remove('drag'); });
canvas.addEventListener('pointerleave', () => { if (!ptrs.size) { $('tip').hidden = true; setHover(null); } });
canvas.addEventListener('wheel', e => { e.preventDefault(); anim = null; zoom(Math.exp(e.deltaY * 0.0012)); }, { passive: false });
function pinchDist() { const [a, b] = [...ptrs.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; }
function zoom(f) {
  if (view.mode === 'globe') view.dist = 1 + Math.max(0.03, Math.min(7, (view.dist - 1) * f));
  else { view.fz = Math.max(0.03, Math.min(fitFlat(), view.fz * f)); clampFlat(); }
}
function clampFlat() {
  const hh = Math.tan(20 * RAD) * view.fz, hw = hh * camera.aspect;
  view.px = Math.max(-2 + Math.min(hw, 2), Math.min(2 - Math.min(hw, 2), view.px));
  view.py = Math.max(-1 + Math.min(hh, 1), Math.min(1 - Math.min(hh, 1), view.py));
}

// луч из курсора → (широта, долгота) в градусах
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const sphere = new THREE.Sphere(new THREE.Vector3(), 1), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const hit = new THREE.Vector3(), inv = new THREE.Matrix3();
function latLonAt(x, y) {
  if (view.morph > 0.001 && view.morph < 0.999) return null;
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (view.mode === 'globe') {
    if (!ray.ray.intersectSphere(sphere, hit)) return null;
    inv.copy(U.uRot.value).transpose(); hit.applyMatrix3(inv);
    return [Math.asin(Math.max(-1, Math.min(1, hit.y))) * DEG, Math.atan2(hit.x, hit.z) * DEG];
  }
  if (!ray.ray.intersectPlane(plane, hit) || Math.abs(hit.x) > 2 || Math.abs(hit.y) > 1) return null;
  return [hit.y * 90, hit.x * 90];
}
function countryAt(lat, lon) {
  const p = [lon, lat];
  let best = null;
  for (const f of features) {
    const [[x0, y0], [x1, y1]] = f.bounds;
    if (lat < y0 || lat > y1) continue;
    if (x0 <= x1 ? (lon < x0 || lon > x1) : (lon < x0 && lon > x1)) continue;
    if (d3.geoContains(f, p) && (!best || f.area < best.area)) best = f;
  }
  return best;
}

let hoverF = null, selF = null, hoverQueued = null;
function setHover(f) {
  if (f === hoverF) return;
  hoverF = f;
  hoverLines = setLines(hoverLines, f && f !== selF ? f : null, hoverMat);
}
function hover(x, y) {
  if (matchMedia('(hover: none)').matches) return;
  hoverQueued = [x, y];
}
function doHover() {
  if (!hoverQueued) return;
  const [x, y] = hoverQueued; hoverQueued = null;
  const ll = latLonAt(x, y), tip = $('tip');
  const f = ll && countryAt(ll[0], ll[1]);
  setHover(f);
  if (f) { tip.textContent = f.ru; tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.hidden = false; }
  else tip.hidden = true;
}

function fmtLL(lat, lon, d = 3) {
  lon = ((lon + 540) % 360) - 180;
  return Math.abs(lat).toFixed(d) + '° ' + (lat >= 0 ? 'с.ш.' : 'ю.ш.') + ', ' + Math.abs(lon).toFixed(d) + '° ' + (lon >= 0 ? 'в.д.' : 'з.д.');
}
function pick(x, y) {
  const ll = latLonAt(x, y);
  if (!ll) return;
  const f = countryAt(ll[0], ll[1]);
  showInfo(f, ll[0], ll[1]);
}
function showInfo(f, lat, lon) {
  selF = f;
  hiLines = setLines(hiLines, f, hiMat);
  hoverLines = setLines(hoverLines, null, hoverMat);
  $('cName').textContent = f ? f.ru : 'Мировой океан';
  $('cHint').hidden = true; $('cData').hidden = false;
  $('cCoord').textContent = fmtLL(lat, lon);
  const elev = Math.asin(Math.max(-1, Math.min(1, nVec(lat * RAD, lon * RAD).dot(nVec(sun.lat, sun.lon))))) * DEG;
  $('cSun').textContent = (elev >= 0 ? 'над горизонтом ' : 'под горизонтом ') + Math.abs(elev).toFixed(0) + '° · ' +
    (elev > 0 ? 'день' : elev > -6 ? 'сумерки' : 'ночь');
  const now = new Date();
  const solar = ((now.getUTCHours() * 60 + now.getUTCMinutes()) + lon * 4 + 1440 * 2) % 1440;
  $('cTime').textContent = String(Math.floor(solar / 60)).padStart(2, '0') + ':' + String(Math.floor(solar % 60)).padStart(2, '0');
}

// перелёт к стране
function flyTo(f) {
  const [lon, lat] = f.centroid;
  const span = Math.max(f.bounds[1][1] - f.bounds[0][1], ((f.bounds[1][0] - f.bounds[0][0]) + 360) % 360 || 360);
  const to = { ...view };
  if (view.mode === 'globe') {
    let dl = lon * RAD - view.lon; dl = Math.atan2(Math.sin(dl), Math.cos(dl));
    to.lon = view.lon + dl; to.lat = Math.max(-80, Math.min(80, lat)) * RAD;
    to.dist = 1 + Math.max(0.12, Math.min(2.4, span / 38));
  } else {
    to.px = lon / 90; to.py = lat / 90;
    to.fz = Math.max(0.08, Math.min(fitFlat(), span / 32));
  }
  view.spin = false; setPressed('bSpin', false);
  anim = { from: { ...view }, to, t0: performance.now(), dur: reduceMotion ? 1 : 1400 };
  showInfo(f, lat, lon);
}

// режимы
function setPressed(id, v) { $(id).setAttribute('aria-pressed', String(v)); }
function setMode(m) {
  if (m === view.mode) return;
  if (m === 'flat') {
    view.fz = fitFlat(); view.px = 0; view.py = 0;
  } else {
    view.dist = Math.max(view.dist, 2.6);
  }
  view.mode = m;
  setPressed('bGlobe', m === 'globe'); setPressed('bFlat', m === 'flat');
  $('tip').hidden = true; setHover(null);
}
$('bGlobe').onclick = () => setMode('globe');
$('bFlat').onclick = () => setMode('flat');
$('bBorders').onclick = () => { borders.visible = !borders.visible; setPressed('bBorders', borders.visible); };
$('bNight').onclick = () => { U.uNightOn.value = U.uNightOn.value ? 0 : 1; setPressed('bNight', !!U.uNightOn.value); };
$('bSpin').onclick = () => { view.spin = !view.spin; setPressed('bSpin', view.spin); if (view.spin) setMode('globe'); };
setPressed('bSpin', view.spin);

// поиск
const q = $('q'), sugg = $('sugg');
const sorted = features.filter(f => f.ru).slice().sort((a, b) => a.ru.localeCompare(b.ru, 'ru'));
let act = 0, list = [];
function renderSugg() {
  const s = q.value.trim().toLowerCase();
  if (!s) { sugg.hidden = true; return; }
  list = sorted.filter(f => f.ru.toLowerCase().includes(s) || f.properties.name.toLowerCase().includes(s))
               .sort((a, b) => (b.ru.toLowerCase().startsWith(s)) - (a.ru.toLowerCase().startsWith(s))).slice(0, 8);
  act = 0;
  sugg.innerHTML = '';
  if (!list.length) { sugg.innerHTML = '<button disabled>Ничего не найдено</button>'; sugg.hidden = false; return; }
  list.forEach((f, i) => {
    const b = document.createElement('button');
    b.textContent = f.ru; if (i === act) b.className = 'act';
    b.onmousedown = ev => { ev.preventDefault(); choose(f); };
    sugg.appendChild(b);
  });
  sugg.hidden = false;
}
function choose(f) { q.value = f.ru; sugg.hidden = true; q.blur(); flyTo(f); }
q.addEventListener('input', renderSugg);
q.addEventListener('blur', () => setTimeout(() => sugg.hidden = true, 100));
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && list[act]) choose(list[act]);
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); act = (act + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length;
    [...sugg.children].forEach((b, i) => b.className = i === act ? 'act' : '');
  } else if (e.key === 'Escape') sugg.hidden = true;
});

// ---------- цикл ----------
updateSun(); setInterval(updateSun, 30000);
let tPrev = performance.now();
function frame(t) {
  const raw = Math.max(0, (t - tPrev) / 1000), dt = Math.min(0.05, raw); tPrev = t;
  const target = view.mode === 'flat' ? 1 : 0;
  if (view.morph !== target) {
    const step = reduceMotion ? 1 : Math.min(raw, 0.2) / 1.1;
    view.morph = target > view.morph ? Math.min(1, view.morph + step) : Math.max(0, view.morph - step);
  }
  if (anim) {
    let k = Math.min(1, (t - anim.t0) / anim.dur); const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    for (const key of ['lat', 'lon', 'px', 'py']) view[key] = anim.from[key] + (anim.to[key] - anim.from[key]) * e;
    // глобус: отлетаем назад в середине пути, затем приближаемся
    const lift = Math.sin(k * PI) * 0.6;
    view.dist = anim.from.dist + (anim.to.dist - anim.from.dist) * e + (view.mode === 'globe' ? lift : 0);
    view.fz = Math.exp(Math.log(anim.from.fz) + (Math.log(anim.to.fz) - Math.log(anim.from.fz)) * e);
    if (k >= 1) anim = null;
  }
  if (view.spin && view.mode === 'globe') view.lon += dt * 0.06;
  applyView();
  doHover();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
